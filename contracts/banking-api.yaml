openapi: 3.1.0

info:
  title: Financial App — Banking API
  version: 1.0.0
  description: |
    Shared REST API for the **Financial App** portfolio project. The same service backs
    both the Angular and the React frontend when either of them runs in `api` mode.

    ## Scope

    This is a fictional personal-banking simulation built for a portfolio. It holds no
    real accounts, cards or payment credentials, performs no payment processing and
    makes **no claim** to meet real banking security or regulatory requirements.

    ## Money representation

    Every monetary value is a `Money` object carrying an **integer amount in the
    currency's minor unit** plus an explicit ISO-4217 `currency` code. EUR 12.34 is
    `{ "amountMinor": 1234, "currency": "EUR" }`.

    Floating-point numbers are never authoritative. `amountMinor` is always a signed
    safe integer for balances, and always a **positive** integer for transactions and
    transfers — direction (`debit` / `credit`) carries the sign.

    Supported currencies and their minor-unit precision: `EUR` (2), `GBP` (2).

    ## Errors

    Every non-2xx response uses the same `Error` body with a stable, machine-readable
    `code`. Clients map `code` to a localised message; `message` is a safe English
    fallback and must never be shown in place of a translated string when a
    translation exists.

    ## Transfer idempotency

    `POST /transfers` requires an `Idempotency-Key` header. The key is generated by
    the client when the user reaches the transfer review step.

    * Scope: global per key value, retained for the lifetime of the database row.
    * Replay with the **same** key and an **equivalent** payload returns the original
      transfer with `200 OK` and `Idempotency-Replayed: true`. No second pair of
      ledger entries is created and balances are untouched.
    * Replay with the same key and a **different** payload is rejected with
      `409 Conflict` and code `IDEMPOTENCY_KEY_REUSED`.
    * A first use returns `201 Created`.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8080/api
    description: Local development

tags:
  - name: Health
  - name: Accounts
  - name: Cards
  - name: Transactions
  - name: Transfers

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness and build information
      description: Used by the frontends to verify that API mode is reachable before use.
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                up:
                  value:
                    status: UP
                    version: 1.0.0
                    profile: local

  /accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List every demo account
      responses:
        '200':
          description: All accounts, in a stable display order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
              examples:
                accounts:
                  value:
                    - id: acc-current
                      name: Everyday Current
                      type: current
                      maskedIban: 'IE29 •••• •••• 4471'
                      balance: { amountMinor: 318540, currency: EUR }
                      available: { amountMinor: 303540, currency: EUR }
                      status: active

  /accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Fetch a single account
      responses:
        '200':
          description: The requested account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404':
          $ref: '#/components/responses/NotFound'

  /cards:
    get:
      tags: [Cards]
      operationId: listCards
      summary: List every virtual card
      parameters:
        - name: accountId
          in: query
          required: false
          description: Restrict the result to cards attached to this account.
          schema: { type: string }
      responses:
        '200':
          description: Matching cards.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Card' }

  /cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      tags: [Cards]
      operationId: getCard
      summary: Fetch a single card
      responses:
        '200':
          description: The requested card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '404':
          $ref: '#/components/responses/NotFound'

  /cards/{cardId}/status:
    parameters:
      - $ref: '#/components/parameters/CardId'
    patch:
      tags: [Cards]
      operationId: updateCardStatus
      summary: Freeze or unfreeze a card
      description: |
        Allowed transitions: `active → frozen` and `frozen → active`. Setting a card to
        the status it already holds is accepted and is a no-op, which keeps the
        operation safe to retry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCardStatusRequest' }
            examples:
              freeze:
                value: { status: frozen }
      responses:
        '200':
          description: The card after the transition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'

  /transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: Search, filter and sort ledger entries
      description: |
        Filters are combined with AND. `search` matches the counterparty or the
        reference, case-insensitively. The result is always deterministically ordered:
        the chosen sort key first, then transaction id as a tie-breaker.
      parameters:
        - name: accountId
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/TransactionCategory' }
        - name: direction
          in: query
          schema: { $ref: '#/components/schemas/TransactionDirection' }
        - name: search
          in: query
          schema: { type: string, maxLength: 120 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [date-desc, date-asc, amount-desc, amount-asc]
            default: date-desc
        - name: page
          in: query
          description: Zero-based page index.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          description: Page size. The frontends request the full history for analytics.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: A page of matching transactions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '400':
          $ref: '#/components/responses/ValidationFailed'

  /transactions/{transactionId}:
    parameters:
      - name: transactionId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Fetch a single ledger entry
      responses:
        '200':
          description: The requested transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404':
          $ref: '#/components/responses/NotFound'

  /transfers:
    post:
      tags: [Transfers]
      operationId: createTransfer
      summary: Execute an internal transfer between the user's own accounts
      description: |
        Validated and applied atomically. On success the source account is debited, the
        destination account is credited, and exactly two linked ledger entries sharing
        the new `transferId` are written. A rejected transfer changes nothing.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated request token, stable across retries of the same intent.
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransferRequest' }
            examples:
              toSavings:
                value:
                  sourceAccountId: acc-current
                  destinationAccountId: acc-savings
                  amount: { amountMinor: 12550, currency: EUR }
                  reference: Monthly savings
      responses:
        '201':
          description: The transfer was executed.
          headers:
            Idempotency-Replayed:
              schema: { type: boolean }
              description: Always `false` on a first execution.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '200':
          description: |
            The same idempotency key was already used with an equivalent payload. The
            original transfer is replayed; no new ledger entries were created.
          headers:
            Idempotency-Replayed:
              schema: { type: boolean }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The idempotency key was reused with a different payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                reused:
                  value:
                    code: IDEMPOTENCY_KEY_REUSED
                    message: This idempotency key was already used with a different transfer.
                    timestamp: '2026-01-14T10:21:44Z'
        '422':
          description: |
            The request is syntactically valid but violates a business invariant,
            for example insufficient funds or a currency mismatch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                insufficientFunds:
                  value:
                    code: INSUFFICIENT_FUNDS
                    message: Not enough available funds in the source account.
                    timestamp: '2026-01-14T10:21:44Z'

  /transfers/{transferId}:
    parameters:
      - name: transferId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Transfers]
      operationId: getTransfer
      summary: Fetch a previously executed transfer
      responses:
        '200':
          description: The requested transfer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string }

  responses:
    NotFound:
      description: The referenced resource does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            account:
              value:
                code: ACCOUNT_NOT_FOUND
                message: The requested account could not be found.
                timestamp: '2026-01-14T10:21:44Z'
    ValidationFailed:
      description: The request failed field-level validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            amount:
              value:
                code: VALIDATION_FAILED
                message: The request could not be validated.
                timestamp: '2026-01-14T10:21:44Z'
                details:
                  - field: amount.amountMinor
                    code: AMOUNT_NOT_POSITIVE
                    message: The amount must be greater than zero.

  schemas:
    CurrencyCode:
      type: string
      enum: [EUR, GBP]
      description: ISO-4217 code. Both supported currencies have a minor-unit precision of 2.

    Money:
      type: object
      required: [amountMinor, currency]
      additionalProperties: false
      properties:
        amountMinor:
          type: integer
          format: int64
          description: |
            Amount in the currency's minor unit. Signed for balances; strictly positive
            for transaction and transfer amounts.
          examples: [1234]
        currency:
          $ref: '#/components/schemas/CurrencyCode'

    Health:
      type: object
      required: [status, version, profile]
      properties:
        status:
          type: string
          enum: [UP]
        version:
          type: string
        profile:
          type: string
          description: Active Spring profile, e.g. `local`.

    AccountType:
      type: string
      enum: [current, savings, joint]

    AccountStatus:
      type: string
      enum: [active, closed]
      description: Only `active` accounts are eligible as a transfer source or destination.

    Account:
      type: object
      required: [id, name, type, maskedIban, balance, available, status]
      properties:
        id: { type: string, examples: [acc-current] }
        name: { type: string, examples: [Everyday Current] }
        type: { $ref: '#/components/schemas/AccountType' }
        maskedIban:
          type: string
          description: Fictional, partially masked IBAN. Never a usable account identifier.
          examples: ['IE29 •••• •••• 4471']
        balance:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Booked balance.
        available:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Booked balance minus pending debit holds. Transfers spend from this.
        status: { $ref: '#/components/schemas/AccountStatus' }

    CardStatus:
      type: string
      enum: [active, frozen]

    CardNetwork:
      type: string
      enum: [visa, mastercard]

    Card:
      type: object
      required: [id, accountId, label, holderName, maskedNumber, expiry, network, status]
      properties:
        id: { type: string, examples: [card-everyday] }
        accountId: { type: string }
        label: { type: string, examples: [Everyday virtual card] }
        holderName: { type: string, examples: [Elena Vasquez] }
        maskedNumber:
          type: string
          description: Display-only fictional value. Not a payment credential.
          examples: ['•••• •••• •••• 4218']
        expiry:
          type: string
          pattern: '^(0[1-9]|1[0-2])\/\d{2}$'
          examples: ['09/29']
        network: { $ref: '#/components/schemas/CardNetwork' }
        status: { $ref: '#/components/schemas/CardStatus' }

    UpdateCardStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { $ref: '#/components/schemas/CardStatus' }

    TransactionDirection:
      type: string
      enum: [debit, credit]
      description: '`debit` leaves the account, `credit` arrives in it.'

    TransactionStatus:
      type: string
      enum: [completed, pending, failed]
      description: Only `completed` entries affect balances and analytics.

    TransactionCategory:
      type: string
      enum:
        [
          groceries,
          dining,
          transport,
          housing,
          utilities,
          shopping,
          health,
          entertainment,
          income,
          transfer,
        ]
      description: |
        The `transfer` category marks internal movements between the user's own
        accounts. Clients exclude it from income and spending analytics.

    Transaction:
      type: object
      required: [id, accountId, counterparty, category, bookedAt, amount, direction, status]
      properties:
        id: { type: string }
        accountId: { type: string }
        counterparty: { type: string }
        category: { $ref: '#/components/schemas/TransactionCategory' }
        bookedAt: { type: string, format: date-time }
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Always positive; `direction` carries the sign.
        direction: { $ref: '#/components/schemas/TransactionDirection' }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        reference: { type: string }
        transferId:
          type: string
          description: Present on both legs of an internal transfer; the two legs share it.

    TransactionPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }

    CreateTransferRequest:
      type: object
      required: [sourceAccountId, destinationAccountId, amount]
      additionalProperties: false
      properties:
        sourceAccountId: { type: string, minLength: 1 }
        destinationAccountId: { type: string, minLength: 1 }
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Must be strictly positive and match both accounts' currency.
        reference: { type: string, maxLength: 140 }

    Transfer:
      type: object
      required:
        [
          id,
          sourceAccountId,
          destinationAccountId,
          amount,
          createdAt,
          status,
          debitTransactionId,
          creditTransactionId,
        ]
      properties:
        id: { type: string }
        sourceAccountId: { type: string }
        destinationAccountId: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        reference: { type: string }
        createdAt: { type: string, format: date-time }
        status:
          type: string
          enum: [completed]
        debitTransactionId:
          type: string
          description: Ledger entry written on the source account.
        creditTransactionId:
          type: string
          description: Ledger entry written on the destination account.

    ErrorCode:
      type: string
      description: |
        Stable machine-readable error identifier. The transfer-specific codes are
        identical to the codes produced by each frontend's local demo policy, so the
        UI renders the same translated message in demo mode and in API mode.
      enum:
        - VALIDATION_FAILED
        - ACCOUNT_NOT_FOUND
        - CARD_NOT_FOUND
        - TRANSACTION_NOT_FOUND
        - TRANSFER_NOT_FOUND
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - SOURCE_REQUIRED
        - DESTINATION_REQUIRED
        - SAME_ACCOUNT
        - SOURCE_NOT_FOUND
        - DESTINATION_NOT_FOUND
        - SOURCE_INELIGIBLE
        - DESTINATION_INELIGIBLE
        - AMOUNT_REQUIRED
        - AMOUNT_NOT_POSITIVE
        - AMOUNT_PRECISION
        - CURRENCY_MISMATCH
        - INSUFFICIENT_FUNDS
        - INTERNAL_ERROR

    ErrorDetail:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }

    Error:
      type: object
      required: [code, message, timestamp]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          type: string
          description: Safe English fallback. Never contains stack traces or internals.
        timestamp: { type: string, format: date-time }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
