name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-web:
    name: React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/react-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/react-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:styles
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run e2e:install
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-playwright-report
          path: app/react-web/playwright-report
          retention-days: 7

  angular-web:
    name: Angular frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/angular-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/angular-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run build:api
      - run: npm run e2e:install
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: angular-playwright-report
          path: app/angular-web/playwright-report
          retention-days: 7

  banking-api:
    name: Spring Boot API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/banking-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x ./mvnw
      - run: ./mvnw --batch-mode clean verify
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: banking-api-surefire-reports
          path: services/banking-api/target/surefire-reports
          retention-days: 7
